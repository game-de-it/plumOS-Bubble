[Unit]
Wants=plumos-boot-probe.service
After=plumos-boot-probe.service
OnFailure=plumos-boot-probe-failure@%n.service

[Service]
ExecStartPre=/storage/plumos/boot-probe/bin/plumos-boot-probe-log S70_FRONTEND_PRE_START
ExecStartPost=/storage/plumos/boot-probe/bin/plumos-boot-probe-log --fat S80_FRONTEND_STARTED
