# Bubble bring-up ALSA configuration.
#
# Keep direct hardware PCM/control names self-contained.  The full Debian
# alsa.conf follows its compiled-in /usr/share/alsa confdir even when it is
# loaded from the app layer, which is not present in the read-only minimal
# System used by this probe.

ctl.!default {
    type hw
    card 0
}

ctl.hw {
    @args [ CARD ]
    @args.CARD {
        type string
    }
    type hw
    card $CARD
}

ctl.sysdefault {
    @args [ CARD ]
    @args.CARD {
        type string
        default 0
    }
    type hw
    card $CARD
}

pcm.!default {
    type hw
    card 0
    device 0
}

pcm.hw {
    @args [ CARD DEV SUBDEV ]
    @args.CARD {
        type string
    }
    @args.DEV {
        type integer
        default 0
    }
    @args.SUBDEV {
        type integer
        default -1
    }
    type hw
    card $CARD
    device $DEV
    subdevice $SUBDEV
}
